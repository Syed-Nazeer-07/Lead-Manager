name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test API
        run: npm test
      - name: Build frontend
        run: npm run build
